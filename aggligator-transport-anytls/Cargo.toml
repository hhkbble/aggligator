[package]
name = "aggligator-transport-anytls"
version = "0.1.0"
description = "Aggligator transport: AnyTLS client"
categories = ["asynchronous", "network-programming"]
keywords = ["aggligator", "aggligator-transport", "anytls", "proxy", "tls"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
aggligator = { version = "0.12.0", path = "../aggligator" }

async-trait = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

md-5 = "0.10"
rustls = { version = "0.23", default-features = false }
sha2 = "0.10"
tokio-rustls = { version = "0.26", default-features = false }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23" }
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "test-util"] }
webpki-roots = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
