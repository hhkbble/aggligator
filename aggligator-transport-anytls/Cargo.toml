[package]
name = "aggligator-transport-anytls"
version = "0.1.0"
description = "Aggligator transport: AnyTLS client"
categories = ["asynchronous", "network-programming"]
keywords = ["aggligator", "aggligator-transport", "anytls", "proxy", "tls"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
aggligator = { version = "0.12.0", path = "../aggligator" }

async-trait = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

boring = "5.2"
boring-sys = "5.2"
brotli-decompressor = "5"
foreign-types = "0.5"
md-5 = "0.10"
sha2 = "0.10"
tokio-boring = "5.2"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = { version = "0.23" }
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "test-util"] }
tokio-rustls = { version = "0.26" }
webpki-root-certs = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
